<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Betta Tank Setup Timeline</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #0a1628 0%, #0d2540 40%, #0a1e35 100%);
    font-family: 'Playfair Display', Georgia, serif;
    padding: 48px 24px;
    position: relative;
    overflow-x: hidden;
  }

  /* Bubbles */
  .bubble {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    animation: float var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
    50%       { transform: translateY(-20px) scale(1.05); opacity: 0.8; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 var(--phase-color-a); }
    50%       { box-shadow: 0 0 0 8px transparent; }
  }

  /* Layout */
  .container {
    max-width: 780px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 56px;
    animation: fadeUp 0.6s ease both;
  }
  .header .fish-emoji { font-size: 44px; margin-bottom: 12px; display: block; }
  .header h1 {
    color: #e8f4ff;
    font-size: clamp(20px, 4vw, 30px);
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .header p {
    color: #6aadce;
    font-size: 15px;
    letter-spacing: 0.04em;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Timeline wrapper */
  .timeline {
    position: relative;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 28px;
    top: 0; bottom: 0;
    width: 2px;
    background: linear-gradient(to bottom, #4a9eca, #2d8a6e, #7b68c8, #c47f2a, #d94f7a);
    opacity: 0.4;
  }

  /* Phase row */
  .phase {
    display: flex;
    gap: 24px;
    margin-bottom: 32px;
    animation: fadeUp 0.5s ease both;
    cursor: pointer;
  }
  .phase:last-child { margin-bottom: 0; }

  /* Node circle */
  .node {
    flex-shrink: 0;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    position: relative;
    z-index: 1;
    border: 2px solid var(--c);
    background: radial-gradient(circle at 35% 35%, var(--c-dark), var(--c-mid));
    transition: box-shadow 0.3s ease;
  }
  .phase.open .node {
    animation: pulse 2s infinite;
    box-shadow: 0 0 20px var(--c-glow);
  }

  /* Card */
  .card {
    flex: 1;
    border-radius: 14px;
    padding: 18px 22px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }
  .phase:hover .card {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .phase.open .card {
    background: linear-gradient(135deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
    border-color: var(--c-border);
  }

  /* Card header row */
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .card-week {
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--c);
    text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
    display: block;
    margin-bottom: 4px;
  }
  .card-title {
    color: #e8f4ff;
    font-size: 18px;
    font-weight: 400;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .tag {
    background: var(--c-tag-bg);
    border: 1px solid var(--c-tag-border);
    color: var(--c);
    border-radius: 20px;
    padding: 3px 12px;
    font-size: 12px;
    letter-spacing: 0.05em;
    font-family: 'JetBrains Mono', monospace;
  }
  .arrow {
    color: rgba(255,255,255,0.3);
    font-size: 18px;
    transition: transform 0.25s ease;
    display: inline-block;
    line-height: 1;
  }
  .phase.open .arrow { transform: rotate(180deg); }

  /* Checklist */
  .checklist {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--c-divider);
    list-style: none;
  }
  .phase.open .checklist { display: block; }
  .checklist li {
    color: rgba(220,240,255,0.85);
    font-size: 14px;
    line-height: 1.7;
    padding: 3px 0;
    display: flex;
    gap: 10px;
    animation: fadeUp 0.3s ease both;
  }
  .checklist li:nth-child(1) { animation-delay: 0.00s; }
  .checklist li:nth-child(2) { animation-delay: 0.04s; }
  .checklist li:nth-child(3) { animation-delay: 0.08s; }
  .checklist li:nth-child(4) { animation-delay: 0.12s; }
  .checklist li:nth-child(5) { animation-delay: 0.16s; }
  .checklist li:nth-child(6) { animation-delay: 0.20s; }
  .diamond { flex-shrink: 0; color: var(--c); }

  /* Footer */
  .footer-hint {
    text-align: center;
    color: rgba(106,173,206,0.5);
    font-size: 12px;
    margin-top: 40px;
    letter-spacing: 0.06em;
    font-family: 'JetBrains Mono', monospace;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <span class="fish-emoji">🐠</span>
    <h1>Betta Tank Setup</h1>
    <p>A 7-week journey to a thriving aquarium</p>
  </div>

  <div class="timeline" id="timeline"></div>
  <p class="footer-hint">Click any phase to expand checklist</p>
</div>

<script>
const phases = [
  {
    week: "Week 1",
    title: "Purchase & Setup",
    emoji: "🛒",
    color: "#4a9eca",
    tag: "Foundation",
    items: [
      "Buy tank, heater, thermometer",
      "Buy substrate (Manado + sand + gravel)",
      "Buy driftwood, plants (Anubias x2, Java Fern, Amazon Sword)",
      "Buy water conditioner & test kit",
      "Rinse all substrate; soak/boil driftwood",
      "Fill tank, treat water, plant everything",
      "Start heater & filter",
    ],
  },
  {
    week: "Weeks 2–4",
    title: "Nitrogen Cycle",
    emoji: "🔬",
    color: "#2d8a6e",
    tag: "Be patient!",
    items: [
      "Add beneficial bacteria starter",
      "Test water every 2–3 days (ammonia → nitrite → nitrate)",
      "Plants begin establishing roots",
      "Do partial water changes as needed",
      "Cycle is complete when ammonia & nitrite read 0 ppm",
    ],
  },
  {
    week: "Week 5",
    title: "Add Snails",
    emoji: "🐌",
    color: "#7b68c8",
    tag: "First residents",
    items: [
      "Confirm water parameters are stable",
      "Drip-acclimate your 2 Blue Mystery Snails",
      "Observe for 48 hours — they'll help clean algae",
      "Continue testing water weekly",
    ],
  },
  {
    week: "Week 6",
    title: "Add Kuhli Loach",
    emoji: "🐍",
    color: "#c47f2a",
    tag: "Bottom crew",
    items: [
      "Confirm tank is still stable",
      "Drip-acclimate the Kuhli Loach",
      "Provide hiding spots (driftwood is perfect!)",
      "Feed with sinking pellets at night",
    ],
  },
  {
    week: "Week 7+",
    title: "Welcome Your Betta! 🎉",
    emoji: "🐟",
    color: "#d94f7a",
    tag: "The main event",
    items: [
      "Final water parameter check — all must be 0/0/<20 ppm",
      "Float betta's bag in tank for 15–20 mins to equalise temp",
      "Drip-acclimate for 30+ minutes",
      "Dim lights for first day to reduce stress",
      "Monitor interactions with snails closely for 1 week",
    ],
  },
];

// Build bubbles
for (let i = 0; i < 18; i++) {
  const b = document.createElement('div');
  b.className = 'bubble';
  const size = 20 + (i * 17) % 80;
  const opacity = 0.06 + (i % 4) * 0.04;
  b.style.cssText = `
    width:${size}px; height:${size}px;
    left:${(i*37)%100}%; top:${(i*53)%100}%;
    border:1px solid rgba(100,200,255,${opacity});
    --dur:${6 + i%5}s; --delay:${((i*0.7)%5).toFixed(1)}s;
  `;
  document.body.appendChild(b);
}

// Build timeline
const timeline = document.getElementById('timeline');

phases.forEach((phase, i) => {
  const c = phase.color;
  const cHex = c.replace('#','');
  // Rough alpha variants via inline style
  const row = document.createElement('div');
  row.className = 'phase';
  row.style.cssText = `
    --c: ${c};
    --c-dark: ${c}dd;
    --c-mid: ${c}88;
    --c-glow: ${c}66;
    --c-border: ${c}66;
    --c-tag-bg: ${c}22;
    --c-tag-border: ${c}44;
    --c-divider: ${c}33;
    animation-delay: ${i * 0.1}s;
  `;

  row.innerHTML = `
    <div class="node">${phase.emoji}</div>
    <div class="card">
      <div class="card-header">
        <div>
          <span class="card-week">${phase.week}</span>
          <span class="card-title">${phase.title}</span>
        </div>
        <div class="card-meta">
          <span class="tag">${phase.tag}</span>
          <span class="arrow">↓</span>
        </div>
      </div>
      <ul class="checklist">
        ${phase.items.map(item => `<li><span class="diamond">◆</span>${item}</li>`).join('')}
      </ul>
    </div>
  `;

  row.addEventListener('click', () => row.classList.toggle('open'));
  timeline.appendChild(row);
});
</script>
</body>
</html>
